name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extras: dev
            molecular: false
          - python-version: "3.12"
            extras: dev,molecular
            molecular: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: the v2 evidence validator re-hashes the sealed runner
          # at the design commit and checks design-commit ancestry.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.8,<3"
          python -m pip install --disable-pip-version-check -e ".[${{ matrix.extras }}]"
      - name: Validate molecular imports
        if: matrix.molecular
        run: python -c "import homymoly.data.molecular; import ogb, pandas, rdkit"
      - name: Lint
        run: ruff check src tests scripts
      - name: Verify evidence manifest
        run: python scripts/export_publication_evidence.py --verify-only
      - name: Test CPU paths
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest -q
