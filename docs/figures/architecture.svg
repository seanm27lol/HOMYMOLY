<svg xmlns="http://www.w3.org/2000/svg" width="680" height="486" viewBox="0 0 680 486" role="img" aria-label="Architecture and data flow of the identifiable typed-map experiment">
  <title>Architecture and data flow of the identifiable typed-map experiment</title>
  <desc>A group element is planted in the annulus template. The selector observes only identifying markers, chooses one member of a fixed twelve-element basis, and the resulting typed map is scored by transformation accuracy, typed reconstruction error, chain-map residual, and filtered mapping cone.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7873"/>
    </marker>
    <style>
      .box   { fill: #f6f7f9; stroke: #b8b6b1; stroke-width: 1.2; }
      .accent{ fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.4; }
      .out   { fill: #ffffff; stroke: #b8b6b1; stroke-width: 1.2; }
      .h     { font: 600 11.5px Arial, Helvetica, sans-serif; fill: #0b0b0b; }
      .t     { font: 10.5px Arial, Helvetica, sans-serif; fill: #0b0b0b; }
      .s     { font: 10px Arial, Helvetica, sans-serif; fill: #52514e; }
      .m     { font: 10px Consolas, 'DejaVu Sans Mono', monospace; fill: #0b0b0b; }
      .lbl   { font: 9.5px Arial, Helvetica, sans-serif; fill: #7a7873; }
      .flow  { stroke: #7a7873; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="680" height="486" fill="#ffffff"/>

  <!-- template -->
  <rect class="box" x="180" y="14" width="320" height="52" rx="5"/>
  <text class="h" x="340" y="33" text-anchor="middle">synthetic cellular annulus template</text>
  <text class="s" x="340" y="50" text-anchor="middle">12 vertices · 18 edges · 6 faces · 6 sectors · Betti (1, 1, 0)</text>

  <line class="flow" x1="340" y1="66" x2="340" y2="98"/>
  <text class="lbl" x="348" y="86">plant one of 12 dihedral group elements</text>

  <!-- source and target complexes -->
  <rect class="box" x="24" y="102" width="292" height="96" rx="5"/>
  <text class="h" x="38" y="122">SOURCE COMPLEX C</text>
  <text class="m" x="38" y="141">signals x0 (vertices), x1 (edges), x2 (faces)</text>
  <text class="m" x="38" y="158">boundaries dC1, dC2</text>
  <text class="s" x="38" y="180">carries the identifying markers</text>

  <rect class="box" x="364" y="102" width="292" height="96" rx="5"/>
  <text class="h" x="378" y="122">TARGET COMPLEX D</text>
  <text class="m" x="378" y="141">signals y0 (vertices), y1 (edges), y2 (faces)</text>
  <text class="m" x="378" y="158">boundaries dD1, dD2</text>
  <text class="s" x="378" y="180">held out during selection</text>

  <!-- markers into the selector -->
  <line class="flow" x1="170" y1="198" x2="170" y2="228"/>
  <text class="lbl" x="178" y="217">identifying markers only</text>

  <rect class="accent" x="24" y="232" width="292" height="44" rx="5"/>
  <text class="h" x="38" y="251">flattened MLP selector</text>
  <text class="s" x="38" y="267">observes markers; never sees the target</text>

  <line class="flow" x1="170" y1="276" x2="170" y2="302"/>

  <rect class="accent" x="24" y="306" width="292" height="44" rx="5"/>
  <text class="h" x="38" y="325">hard-coded basis of 12 group actions</text>
  <text class="s" x="38" y="341">each a signed permutation in every degree</text>

  <line class="flow" x1="170" y1="350" x2="170" y2="376"/>

  <rect class="accent" x="24" y="380" width="292" height="56" rx="5"/>
  <text class="h" x="38" y="399">ExactChainMapLayer</text>
  <text class="m" x="38" y="416">(F0, F1, F2) in nullspace of dD F − F dC = 0</text>
  <text class="s" x="38" y="430">exactness holds for every parameter value</text>

  <!-- applies to target -->
  <path class="flow" d="M 316 408 L 500 408 L 500 198"/>
  <text class="lbl" x="508" y="300">applies the</text>
  <text class="lbl" x="508" y="313">decoded map</text>

  <!-- outputs: one stem from the layer fanning into all four scores -->
  <path d="M 170 436 L 170 444 L 100 444 M 170 444 L 580 444" fill="none"
        stroke="#7a7873" stroke-width="1.3"/>
  <line class="flow" x1="100" y1="444" x2="100" y2="450"/>
  <line class="flow" x1="260" y1="444" x2="260" y2="450"/>
  <line class="flow" x1="420" y1="444" x2="420" y2="450"/>
  <line class="flow" x1="580" y1="444" x2="580" y2="450"/>
  <rect class="out" x="24" y="452" width="152" height="26" rx="4"/>
  <text class="t" x="100" y="469" text-anchor="middle">transformation accuracy</text>
  <rect class="out" x="184" y="452" width="152" height="26" rx="4"/>
  <text class="t" x="260" y="469" text-anchor="middle">typed reconstruction MSE</text>
  <rect class="out" x="344" y="452" width="152" height="26" rx="4"/>
  <text class="t" x="420" y="469" text-anchor="middle">chain-map residual</text>
  <rect class="out" x="504" y="452" width="152" height="26" rx="4"/>
  <text class="t" x="580" y="469" text-anchor="middle">filtered mapping cone</text>
</svg>
