<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img" aria-label="Edge-to-cycle lifting primary contrasts">
  <title>Edge-to-cycle lifting primary contrasts</title>
  <rect width="680" height="316" fill="#ffffff"/>
  <text x="0.0" y="20.0" font-family="Arial, Helvetica, sans-serif" font-size="13.0" fill="#0b0b0b" text-anchor="start" font-weight="bold">Boundary compatibility improves edge-to-cycle lifting</text>
  <text x="0.0" y="37.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal">Paired log10 held-out-error ratio; negative favors the objective.</text>
  <text x="0.0" y="52.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal">One eligible seed jointly fixes topology, predictors, and training noise.</text>
  <text x="0.0" y="67.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal">29 eligible seeds, 16 noisy training probes; same-family replication.</text>
  <text x="0.0" y="82.0" font-family="Arial, Helvetica, sans-serif" font-size="10.0" fill="#7a7873" text-anchor="start" font-weight="normal">Locked prospectively after outcome-informed weight selection; one execution deviation disclosed.</text>
  <text x="0.0" y="97.0" font-family="Arial, Helvetica, sans-serif" font-size="10.0" fill="#7a7873" text-anchor="start" font-weight="normal">Thick bar: Bonferroni 98.33% (governs the decision).  Thin bar: unadjusted 95%.</text>
