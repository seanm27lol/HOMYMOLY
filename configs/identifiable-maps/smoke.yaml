experiment:
  seed: 20260821
  device: cpu
  deterministic: true

data:
  sectors: 6
  train_samples: 96
  validation_samples: 48
  test_samples: 48
  noise_std: 0.05

model:
  hidden_dim: 64
  dropout: 0.0
  map_temperature: 0.75

training:
  epochs: 6
  batch_size: 24
  learning_rate: 0.003
  weight_decay: 0.0001
  early_stopping_patience: 6
  minimum_improvement: 0.000001
  num_workers: 0

loss:
  ablation: combined
  cone_temperature: 0.05
  rtd_training_entities: 24
  combined_weights:
    task: 1.0
    reconstruction: 1.0
    cell: 0.25
    sheaf: 0.25
    cone: 0.1
    rtd: 0.25

evaluation:
  map_tolerance: 0.00001
  rank_atol: 0.0000001
  exact_rtd_entities: 12
  exact_rtd_max_dim: 1

output:
  directory: artifacts/identifiable-maps/smoke-combined
