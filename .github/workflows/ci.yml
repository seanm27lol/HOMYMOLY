name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extras: dev
            molecular: false
          - python-version: "3.12"
            extras: dev,molecular
            molecular: true
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[${{ matrix.extras }}]"
      - name: Validate molecular imports
        if: matrix.molecular
        run: python -c "import homymoly.data.molecular; import ogb, pandas, rdkit"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test CPU paths
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest -q
