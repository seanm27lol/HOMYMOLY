[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "homymoly"
version = "0.1.0"
description = "Homological routing between structured representations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.3,<4",
  "numpy>=2,<3",
  "PyYAML>=6.0.2,<7",
  "torch>=2.8,<3",
]

[project.optional-dependencies]
dashboard = [
  "tensorboard>=2.18,<3",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
homymoly = "homymoly.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
